---
- name: Bootstrap Ceph cluster
  hosts: loadbalncer
  tasks:

    - name: Ensure SSH service is running
      service:
        name: sshd
        state: started
        enabled: true

    - name: Fetch first monitor IP
      shell: hostname -I | awk '{print $1}'
      register: mon_ip
      ignore_errors: yes

    - name: Get playbook directory
      set_fact:
        playbook_dir_rescue: "{{ inventory_dir | default(lookup('env', 'PWD')) }}"
      tags: always

    - name: Bootstrap Ceph cluster
      command: >-
          cephadm
          {% if docker_registry_enabled %}
          --image 10.1.195.23:5000/ceph:v19
          {% endif %} 
          bootstrap
          {% if docker_registry_enabled %}
          --config initial-ceph.conf
          {% endif %}
          --mon-ip {{ mon_ip.stdout }}
          --initial-dashboard-user  admin
          --initial-dashboard-password admin007
      args:
        chdir: "{{ playbook_dir }}"
      register: bootstrap_result
      ignore_errors: yes

    - name: Display bootstrap results
      debug:
        msg: 
          - "Bootstrap Command Output: {{ bootstrap_result.stdout }}"
          - "Monitor IP Used: {{ mon_ip.stdout }}"

    ####### Install ceph-common package
    - name: Install ceph-common package
      shell: cephadm install ceph-common

    - name: Verify ceph command version
      command: ceph -v
      register: ceph_version_result

    - name: Display ceph command version
      debug:
        msg: "Ceph version: {{ ceph_version_result.stdout }}"

    - name: Verify Ceph status
      command: ceph -s
      register: ceph_status_result

    - name: Display Ceph status
      debug:
        msg: "Ceph status: {{ ceph_status_result.stdout }}"

    - name: Change Standby Behaviour for loadbalancer
      command: ceph config set mgr mgr/dashboard/standby_behaviour "error"
      when: loadbalancer_enabled

    - name: Add storage, consume all available devices
      command: ceph orch apply osd --all-available-devices
      when: create_default_storage_on_all_devices

    - name: Create a CephFS volume named "cephfs" (MDS deamons are created)
      command: ceph fs volume create cephfs
      when: create_default_mds

    - name: Deploy RGWs
      command: ceph orch apply rgw test
      when: create_default_rgw