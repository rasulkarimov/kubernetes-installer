---
- name: Configure HAProxy for SSL/TLS passthrough on loadbalancer node
  hosts: loadbalncer
  #become: yes
  tasks:

    - name: Install HAProxy
      package:
        name: haproxy
        state: present

    - name: Configure HAProxy with SSL/TLS passthrough
      template:
        src: haproxy_ssl.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
      notify:
        - Restart HAProxy

    - name: Ensure HAProxy is enabled and running
      service:
        name: haproxy
        state: started
        enabled: true

  handlers:
    - name: Restart HAProxy
      service:
        name: haproxy
        state: restarted
